<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: iOS 26 blurs/fades the top of a page drawn under the status bar and offers no way to turn that off. The bar tints from theme-color, which main.jsx keeps equal to the page colour. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Thrft● — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap"
      rel="stylesheet"
    />
    <!-- Critical paint: never flash white before CSS/JS load -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        height: 100dvh;
        height: var(--app-height, 100dvh);
        min-height: 0;
        max-height: 100dvh;
        max-height: var(--app-height, 100dvh);
        width: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505;
        color: #f4f4f2;
        font-family: "SF Pro Text", "SF Pro Display", "SF Pro", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
